name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: windows-latest
            cc: cl
            cxx: cl
          - os: macos-latest
            cc: clang
            cxx: clang++
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.x'
    
    - name: Configure CMake
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=ON -DCMAKE_CXX_STANDARD=23 -G "Visual Studio 17 2022"
        else
          cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=ON -DCMAKE_CXX_STANDARD=23
        fi
      shell: bash
    
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}
    
    - name: Run Tests
      run: ctest --test-dir build --config ${{ matrix.build_type }} --output-on-failure
    
    - name: Run Sanitizers (Debug only)
      if: matrix.build_type == 'Debug' && matrix.os == 'ubuntu-latest'
      run: |
        cmake -B build-san -S . -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DENABLE_UBSAN=ON
        cmake --build build-san --config Debug
        ctest --test-dir build-san --config Debug --output-on-failure
    
    - name: Run Benchmarks (Release only)
      if: matrix.build_type == 'Release'
      run: |
        mkdir -p artifacts/benchmarks
        ./build/bench/Benchmark_OrderBook --benchmark_format=json > artifacts/benchmarks/benchmark_results_${{ matrix.os }}_${{ matrix.build_type }}.json
    
    - name: Upload Benchmark Results
      if: matrix.build_type == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-${{ matrix.os }}-${{ matrix.build_type }}
        path: artifacts/benchmarks/

  bindings-test:
    name: Test Language Bindings
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        binding: [go, rust, python]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.x'
    
    - name: Build C++ Library
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=23 -G "Visual Studio 17 2022"
        else
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=23
        fi
        cmake --build build --config Release
      shell: bash
    
    - name: Set up Go
      if: matrix.binding == 'go'
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    
    - name: Test Go Binding
      if: matrix.binding == 'go'
      run: |
        cd bindings/go
        go mod download
        go test -v
    
    - name: Test Go Binding with Race Detector
      if: matrix.binding == 'go'
      run: |
        cd bindings/go
        go test -race -v
    
    - name: Set up Rust
      if: matrix.binding == 'rust'
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    
    - name: Test Rust Binding
      if: matrix.binding == 'rust'
      run: |
        cd bindings/rust
        cargo test --release
    
    - name: Set up Python
      if: matrix.binding == 'python'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Test Python Binding
      if: matrix.binding == 'python'
      run: |
        cd bindings/python
        pip install pytest
        python -m pytest tests/ -v
    
    - name: Type Check Python Binding
      if: matrix.binding == 'python'
      run: |
        cd bindings/python
        pip install mypy
        mypy lob/ --strict

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.x'
    
    - name: Configure with clang-tidy
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=23
    
    - name: Run clang-format check
      run: |
        find . -name '*.cpp' -o -name '*.h' | head -20 | xargs clang-format --dry-run --Werror || echo "clang-format check skipped"
    
    - name: Run clang-tidy
      run: |
        cmake --build build --target tidy
    
    - name: Build with strict warnings
      run: |
        cmake -B build-strict -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror" -DCMAKE_CXX_STANDARD=23
        cmake --build build-strict

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker Image
      run: |
        docker build -t lob-cpp23:latest .
    
    - name: Run Tests in Docker
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace lob-cpp23:latest bash -c "cd /workspace && cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON && cmake --build build && ctest --test-dir build --output-on-failure"

  cpp23-features:
    name: C++23 Feature Testing
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker Image
      run: |
        docker build -t lob-cpp23:latest .
    
    - name: Test C++23 Features
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace lob-cpp23:latest bash -c "cd /workspace && cmake -B build-cpp23 -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_APPS=OFF && cmake --build build-cpp23"
    
    - name: Test Kokkos mdspan Integration
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace lob-cpp23:latest bash -c "cd /workspace && g++ -std=c++23 -I/tmp/mdspan/include -DHAVE_KOKKOS_MDSPAN test_mdspan_integration.cpp -o test_mdspan_integration && ./test_mdspan_integration"
    
    - name: Check C++23 Feature Detection
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace lob-cpp23:latest bash -c "cd /workspace && cmake -B build-check -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_APPS=OFF 2>&1 | grep 'C++23 Feature Detection Results' -A 10"

  documentation-build:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install documentation dependencies
      run: |
        pip install sphinx sphinx-rtd-theme breathe myst-parser
    
    - name: Build documentation
      run: |
        mkdir -p artifacts/docs
        # Documentation build commands would go here
        # sphinx-build -b html docs/ artifacts/docs/
    
    - name: Upload Documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: artifacts/docs/
