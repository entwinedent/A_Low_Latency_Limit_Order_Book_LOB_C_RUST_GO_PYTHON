version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "maintainer"
    assignees:
      - "maintainer"
    commit-message:
      prefix: "ci"
      include: "scope"

  # CMake dependencies (via FetchContent)
  - package-ecosystem: "cmake"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 3
    reviewers:
      - "maintainer"
    assignees:
      - "maintainer"
    commit-message:
      prefix: "deps"
      include: "scope"

  # Python dependencies (for documentation and tools)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 3
    reviewers:
      - "maintainer"
    assignees:
      - "maintainer"
    commit-message:
      prefix: "py"
      include: "scope"

  # Go dependencies (for Go bindings)
  - package-ecosystem: "gomod"
    directory: "/bindings/go"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 3
    reviewers:
      - "maintainer"
    assignees:
      - "maintainer"
    commit-message:
      prefix: "go"
      include: "scope"

  # Rust dependencies (for Rust bindings)
  - package-ecosystem: "cargo"
    directory: "/bindings/rust"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 3
    reviewers:
      - "maintainer"
    assignees:
      - "maintainer"
    commit-message:
      prefix: "rust"
      include: "scope"
