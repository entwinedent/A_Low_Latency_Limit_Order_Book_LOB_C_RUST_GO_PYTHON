[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lob-engine"
version = "0.1.0"
description = "Low-Latency Order Book Engine Python bindings"
authors = [{name = "LOB Engine Contributors"}]
license = {text = "MIT"}
requires-python = ">=3.12"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/example/lob-engine"
Repository = "https://github.com/example/lob-engine"

[tool.setuptools]
packages = ["lob"]

[tool.setuptools.package-data]
lob = ["*.pyi"]
