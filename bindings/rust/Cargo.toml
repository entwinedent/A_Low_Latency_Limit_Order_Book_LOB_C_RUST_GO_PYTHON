[package]
name = "lob-engine"
version = "0.1.0"
edition = "2021"
authors = ["LOB Engine Contributors"]
description = "Low-Latency Order Book Engine bindings"
license = "MIT"
repository = "https://github.com/example/lob-engine"

[lib]
name = "lob_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Safe C++ interop using cxx (manual bridge)
cxx = "1.0"

# High-performance synchronization
parking_lot = "0.12"

# Async runtime (for future async support)
tokio = { version = "1.0", features = ["full"], optional = true }

# Logging
log = "0.4"
env_logger = "0.11"

# Testing
proptest = "1.0"

[dev-dependencies]
criterion = "0.5"

[build-dependencies]
cxx-build = "1.0"
cc = "1.0"

[features]
default = []
async = ["tokio"]
